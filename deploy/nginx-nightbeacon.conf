# Nginx site config for Nightbeacon.
# Installed by deploy/03-deploy.sh to /etc/nginx/sites-available/nightbeacon.
# `certbot --nginx` will rewrite this to add the TLS server block on top of it
# once a real domain points at this VM.

server {
    listen 80;
    server_name _;  # replace with your real domain once DNS is set, or pass -d to certbot

    server_tokens off;

    # Frontend: the built static Vite app. React Router needs the SPA
    # fallback (try_files ... /index.html) so client-side routes like
    # /dashboard or /content/123 don't 404 on a hard refresh.
    root __REPO_DIR__/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API — proxied to the Express process. Never exposed on its own
    # port externally; only reachable through this proxy.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Session cookies rely on this being accurate for the Secure flag
        # logic in server/src/app.js (NODE_ENV=production there).
    }

    location = /robots.txt { root __REPO_DIR__/web/dist; }
    location = /sitemap.xml { root __REPO_DIR__/web/dist; }
}
